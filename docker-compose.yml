version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agent_tiger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiger
      POSTGRES_PASSWORD: tigerpassword
      POSTGRES_DB: agent_tiger
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiger -d agent_tiger"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: ad-security-neo4j
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/insa@123
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent_tiger_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://tiger:tigerpassword@db:5432/agent_tiger
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
      - AUTHORIZED_SCOPE_CIDR=${AUTHORIZED_SCOPE_CIDR:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=insa@123
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  neo4j_data:
